name: Q-free selector information screen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interval-screen:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run no-dependency synthetic screen
        run: python3 research/interval_screen.py | tee interval-screen.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interval-screen
          path: interval-screen.txt
          retention-days: 2
