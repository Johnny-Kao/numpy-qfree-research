name: Q-free equal-query allowlist versus baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print CPU and install build dependencies
        run: |
          lscpu | grep -E 'Model name|Vendor ID|CPU\(s\)'
          python -m pip install 'meson-python>=0.20' 'Cython>=3.1' ninja pytest hypothesis
      - name: Fetch pinned study source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Johnny-Kao/numpy.git /tmp/numpy-source
          git -C /tmp/numpy-source checkout 8318e2ab15b2a111a9a2e8fcbab937827bf88f91
          git -C /tmp/numpy-source submodule update --init --recursive
      - name: Build three isolated native variants
        run: |
          for mode in baseline equal_only; do
            cp -a /tmp/numpy-source "/tmp/numpy-$mode"
            python research/patch_variant.py "$mode" "/tmp/numpy-$mode/numpy/_core/src/npysort/binsearch.cpp"
            mkdir -p "/tmp/wheel-$mode" "/tmp/np-$mode"
            python -m pip wheel "/tmp/numpy-$mode" --no-build-isolation --no-deps -w "/tmp/wheel-$mode" -Csetup-args=-Dallow-noblas=true
            python -m pip install --no-deps --target "/tmp/np-$mode" "/tmp/wheel-$mode/"*.whl
          done
      - name: Focused correctness and ABBA benchmarks
        run: |
          cd /tmp
          for mode in baseline equal_only; do
            PYTHONPATH="/tmp/np-$mode" python -m pytest --pyargs numpy._core.tests.test_multiarray -k searchsorted -q
          done
          for mode in baseline equal_only equal_only baseline; do
            PYTHONPATH="/tmp/np-$mode" python "$GITHUB_WORKSPACE/research/bench_native.py" "$mode" >> /tmp/native.jsonl
          done
          python "$GITHUB_WORKSPACE/research/compare_equal_only.py" /tmp/native.jsonl
