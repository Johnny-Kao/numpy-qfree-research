name: Q-free early-reject A B C
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU metadata and build dependencies
        run: |
          lscpu | grep -E 'Model name|Vendor ID|CPU\(s\)'
          python -m pip install 'meson-python>=0.20' 'Cython>=3.1' ninja pytest hypothesis
      - name: Fetch pinned NumPy reference
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Johnny-Kao/numpy.git /tmp/numpy-source
          git -C /tmp/numpy-source checkout 8318e2ab15b2a111a9a2e8fcbab937827bf88f91
          git -C /tmp/numpy-source submodule update --init --recursive
      - name: Build isolated Q20 and NoQ variants
        run: |
          for mode in baseline precheck coarse_reuse work_reduction; do
            cp -a /tmp/numpy-source "/tmp/numpy-$mode"
            python research/patch_variant.py "$mode" "/tmp/numpy-$mode/numpy/_core/src/npysort/binsearch.cpp"
            mkdir -p "/tmp/wheel-$mode" "/tmp/np-$mode"
            python -m pip wheel "/tmp/numpy-$mode" --no-build-isolation --no-deps -w "/tmp/wheel-$mode" -Csetup-args=-Dallow-noblas=true
            python -m pip install --no-deps --target "/tmp/np-$mode" "/tmp/wheel-$mode/"*.whl
          done
      - name: Focused correctness and paired stability tests
        run: |
          cd /tmp
          for mode in baseline precheck coarse_reuse work_reduction; do
            PYTHONPATH="/tmp/np-$mode" python -m pytest --pyargs numpy._core.tests.test_multiarray -k searchsorted -q
          done
          for mode in baseline precheck coarse_reuse work_reduction work_reduction coarse_reuse precheck baseline; do
            PYTHONPATH="/tmp/np-$mode" python "$GITHUB_WORKSPACE/research/monte_carlo_native.py" "$mode" >> /tmp/multiseed.jsonl
          done
          python "$GITHUB_WORKSPACE/research/compare_early.py" /tmp/multiseed.jsonl
